<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Project Dashboard</title>

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Projects">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; }
    body { width: 100%; }

    :root {
      --bg: #0a0a0a;
      --surface: #181818;
      --border: #2d2d2d;
      --border-subtle: #202020;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --dim: #666666;
      --bar-planning:    #f59e0b;
      --bar-progress:    #4f8ef7;
      --bar-complete:    #34d058;
      --bar-unknown:     #444444;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      font-size: 13px;
    }

    header {
      max-width: 860px;
      margin: 0 auto 2rem;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    header p {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    #refreshBtn {
      font: inherit;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      cursor: pointer;
    }

    #refreshBtn:hover {
      color: var(--text);
      border-color: var(--dim);
    }

    #refreshBtn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #projects {
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    /* Tablet: single-column-per-card grid, still the compact card */
    @media (min-width: 541px) {
      #projects {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 0.75rem;
      }
    }

    /* Desktop: much more room — wider canvas, richer cards */
    @media (min-width: 1000px) {
      header, #projects {
        max-width: 1440px;
      }

      #projects {
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 1rem;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.125rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      min-width: 0;
    }

    @media (min-width: 1000px) {
      .card {
        padding: 1.25rem 1.375rem;
        gap: 0.75rem;
      }
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      min-width: 0;
    }

    .head-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .chevron {
      font-size: 0.625rem;
      color: var(--dim);
      transition: transform 150ms ease;
    }

    @media (min-width: 1000px) {
      .chevron { display: none; }
    }

    .card h2 {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      min-width: 0;
    }

    @media (min-width: 1000px) {
      .card h2 { font-size: 0.9375rem; }
    }

    /* Status badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.625rem;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bar-unknown);
      flex-shrink: 0;
    }

    .status-dot.planning    { background: var(--bar-planning); }
    .status-dot.in-progress { background: var(--bar-progress); }
    .status-dot.complete    { background: var(--bar-complete); }

    /* Summary — desktop only */
    .summary {
      display: none;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (min-width: 1000px) {
      .summary {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border-subtle);
    }

    /* Next steps */
    .next-steps {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .step {
      font-size: 0.6875rem;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* On mobile/tablet, only show the first 2 steps to keep cards compact */
    .step.extra { display: none; }

    @media (min-width: 1000px) {
      .step { font-size: 0.75rem; -webkit-line-clamp: 3; }
      .step.extra { display: -webkit-box; }
    }

    .at-claude { color: #d97706; font-weight: 600; }
    .at-user   { color: #a78bfa; font-weight: 600; }

    .all-done {
      font-size: 0.6875rem;
      color: var(--bar-complete);
    }

    .no-tasks {
      font-size: 0.6875rem;
      color: var(--dim);
    }

    /* Progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    @media (min-width: 1000px) {
      .progress-bar { height: 4px; }
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--bar-unknown);
    }

    .progress-fill.planning    { background: var(--bar-planning); }
    .progress-fill.in-progress { background: var(--bar-progress); }
    .progress-fill.complete    { background: var(--bar-complete); }

    .progress-label {
      font-size: 0.6875rem;
      color: var(--dim);
      white-space: nowrap;
      min-width: 2.5rem;
      text-align: right;
    }

    /* Footer — hidden on mobile/tablet to keep tiles compact; shown on desktop */
    .card-foot {
      display: none;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      min-width: 0;
    }

    .updated {
      font-size: 0.625rem;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (min-width: 1000px) {
      .card-foot { display: flex; }
    }

    .repo-link {
      font-size: 0.625rem;
      color: #333333;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .repo-link:hover { color: var(--dim); }

    /* Loading / empty */
    .loading, .empty {
      color: var(--muted);
      font-size: 0.75rem;
      grid-column: 1 / -1;
    }

    @media (max-width: 540px) {
      body { padding: 1.25rem 0.75rem 3rem; }
      .card { padding: 0.75rem; }
    }

    /* Tap-to-expand — mobile & tablet only; desktop cards already show full detail */
    @media (max-width: 999px) {
      .card[data-expandable] { cursor: pointer; }

      .card.expanded {
        grid-column: 1 / -1;
        border-color: var(--dim);
      }

      .card.expanded .chevron { transform: rotate(180deg); }

      .card.expanded .summary,
      .card.expanded .step {
        display: block;
        -webkit-line-clamp: unset;
        overflow: visible;
      }

      .card.expanded .card-foot { display: flex; }
    }

    #manageBtn {
      font: inherit;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      cursor: pointer;
    }

    #manageBtn:hover {
      color: var(--text);
      border-color: var(--dim);
    }

    .manage-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .manage-overlay[hidden] { display: none; }

    .manage-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.125rem;
      gap: 0.75rem;
    }

    .manage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .manage-head h2 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
    }

    #manageClose {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1;
      cursor: pointer;
    }

    #manageClose:hover { color: var(--text); }

    .manage-status {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .manage-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-right: 0.25rem;
    }

    .manage-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      color: var(--text);
      cursor: pointer;
    }

    .manage-item input { accent-color: var(--bar-progress); }

    .manage-foot {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
    }

    .btn-ghost, .btn-primary {
      font: inherit;
      font-size: 0.75rem;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .btn-ghost { background: var(--surface); color: var(--muted); }
    .btn-ghost:hover { color: var(--text); border-color: var(--dim); }

    .btn-primary { background: var(--bar-progress); color: #fff; border-color: var(--bar-progress); }
    .btn-primary:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <header>
    <h1>Project Dashboard</h1>
    <p id="meta">
      <span id="metaText">zowen22 · loading…</span>
      <button id="refreshBtn" type="button" aria-label="Refresh">↻ Refresh</button>
      <button id="manageBtn" type="button" aria-label="Manage projects">⚙</button>
    </p>
  </header>
  <main id="projects"><p class="loading">Loading…</p></main>

  <div id="manageOverlay" class="manage-overlay" hidden>
    <div class="manage-panel" role="dialog" aria-modal="true" aria-labelledby="manageTitle">
      <div class="manage-head">
        <h2 id="manageTitle">Manage Projects</h2>
        <button id="manageClose" type="button" aria-label="Close">✕</button>
      </div>
      <p id="manageStatus" class="manage-status">Loading repos…</p>
      <div id="manageList" class="manage-list"></div>
      <div class="manage-foot">
        <button id="manageCancel" type="button" class="btn-ghost">Cancel</button>
        <button id="manageSave" type="button" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'zowen22';

    // Fallback shown the first time the dashboard loads on a browser, before the
    // user has picked anything via the "Manage Projects" panel (⚙, see below).
    const DEFAULT_PROJECTS = [
      'X.-Claude-Project-Dashboard',
      '1.-Autonomous-UAVs',
      '6.-Curriculum-Tool',
      '7.-Golf-Shot-Dispersion-Tool',
      '8.-Magic-Band',
      '9.-High-Ground-Coffee-Club',
      '3.-Better-Golf-League-Tracker',
      // 10.-Personal-Finances is private — client-side fetch can't reach it, excluded until it's public
    ];

    // Which repos to show is a per-browser preference (private repos never show —
    // the dashboard has no auth token to fetch them regardless of selection).
    const SELECTED_KEY = 'dashboard.selectedProjects';

    function loadSelectedProjects() {
      try {
        const parsed = JSON.parse(localStorage.getItem(SELECTED_KEY));
        if (Array.isArray(parsed) && parsed.every(p => typeof p === 'string')) return parsed;
      } catch (e) { /* corrupt or missing — fall through to default */ }
      return DEFAULT_PROJECTS.slice();
    }

    function saveSelectedProjects(list) {
      try { localStorage.setItem(SELECTED_KEY, JSON.stringify(list)); } catch (e) { /* storage unavailable */ }
    }

    let PROJECTS = loadSelectedProjects();

    function formatName(repo) {
      return repo.replace(/^\d+\.-/, '').replace(/^X\.-/, '').replace(/-/g, ' ');
    }

    async function fetchText(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      return res.text();
    }

    async function fetchMeta(repo) {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${repo}`, { cache: 'no-store' });
      if (!res.ok) return 0;
      const d = await res.json();
      return new Date(d.pushed_at).getTime();
    }

    async function fetchProject(repo) {
      const base = `https://raw.githubusercontent.com/${GITHUB_USER}/${repo}/main/1.%20Project%20Management/`;
      const [overview, wp, pushedAt] = await Promise.all([
        fetchText(base + '2.%20Project%20Overview.md'),
        fetchText(base + '3.%20Work%20Packages.md'),
        fetchMeta(repo),
      ]);
      return { repo, overview, wp, pushedAt };
    }

    function parseStatus(text) {
      const m = text.match(/^## Status\s*\n+`([^`]+)`/m);
      return m ? m[1].trim() : null;
    }

    function parseSummary(text) {
      const m = text.match(/^## Summary\s*\n+([\s\S]*?)(?=\n##\s|\n?$)/m);
      if (!m) return null;
      const body = m[1].trim();
      if (!body || /^\*.*\*$/.test(body)) return null; // skip unfilled placeholder text
      return body;
    }

    function highlightOwners(text) {
      return text
        .replace(/@claude/g, '<span class="at-claude">@claude</span>')
        .replace(/@user/g,   '<span class="at-user">@user</span>');
    }

    // Work Packages items carry a lot of inline detail (rationale, dates, links) so a
    // session can resume a task cold. Cards show only the leading headline of each item.
    const STEP_BUDGET    = 95; // at or under this, the line is shown exactly as written
    const STEP_CAP       = 90; // hard truncation when no natural boundary exists
    const STEP_MIN       = 12; // a shorter headline says nothing — try the next boundary
    const STEP_MIN_COLON = 18; // "Phase 2 (later):" is a label, not a headline

    // A WP heading marked finished or parked is skipped: completed packages routinely
    // keep unchecked stragglers, which would otherwise crowd out genuinely live work.
    // A heading with no marker of its own inherits its parent heading's status, so a
    // plain "### WP3.1 - ..." sub-heading under a "## Phase 3 ... *(PAUSED)*" phase
    // stays dead too, instead of resetting to alive just because it lacks its own tag.
    const SECTION_DEAD  = /\b(complete|completed|done|skipped|paused|deferred|on hold|abandoned|dropped|archived)\b/i;
    const SECTION_ALIVE = /\bin progress\b/i;

    function headingVerdict(heading) {
      const m = heading.match(/\*\(([\s\S]*)$/) || heading.match(/\(([^()]*)\)\s*$/);
      if (!m) return null; // no marker of its own -- inherit from the parent heading
      if (SECTION_ALIVE.test(m[1])) return false;
      if (SECTION_DEAD.test(m[1])) return true;
      return null;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // trailing punctuation and any '(' left unclosed by a cut read as truncation artifacts
    function tidy(s) {
      while ((s.split('(').length) > (s.split(')').length)) s = s.slice(0, s.lastIndexOf('('));
      return s.replace(/[\s,;:—–-]+$/, '');
    }

    function stepHeadline(body) {
      const m    = body.match(/^((?:@[\w/]+[\s/]*)+?)-\s*([\s\S]*)$/);
      const pre  = m ? m[1].trim() + ' - ' : '';
      let rest   = (m ? m[2] : body).replace(/[*`]/g, '').replace(/\s+/g, ' ').trim();

      if (pre.length + rest.length <= STEP_BUDGET) return pre + rest;

      rest = rest.replace(/\s*\([^()]{0,60}\)/g, ''); // drop short asides, keep the spine
      if (pre.length + rest.length <= STEP_BUDGET) return pre + tidy(rest);

      const cuts = [];
      for (const re of [/ — /g, / – /g, / -- /g]) {
        let mm; while ((mm = re.exec(rest)) !== null) cuts.push(mm.index);
      }
      const colon = /: /g;
      let cm; while ((cm = colon.exec(rest)) !== null) {
        if (cm.index >= STEP_MIN_COLON) cuts.push(cm.index);
      }
      for (const pos of cuts.sort((a, b) => a - b)) {
        if (pos < STEP_MIN) continue;
        const cut = tidy(rest.slice(0, pos));
        if (cut.length >= STEP_MIN) return pre + cut;
      }
      const hard = rest.slice(0, STEP_CAP);
      const sp   = hard.lastIndexOf(' ');
      return pre + tidy(sp > 0 ? hard.slice(0, sp) : hard) + ' …';
    }

    function parseNextSteps(text, max = 5) {
      const live = [];
      const stack = []; // {level, dead} chain of headings currently open, shallowest first
      for (const line of text.split('\n')) {
        const hm = line.match(/^(#{2,4})\s+(.*)$/);
        if (hm) {
          const level = hm[1].length;
          while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
          const verdict    = headingVerdict(hm[2].trim());
          const parentDead = stack.length ? stack[stack.length - 1].dead : false;
          stack.push({ level, dead: verdict !== null ? verdict : parentDead });
        } else if (/^- \[ \] /.test(line) && !(stack.length && stack[stack.length - 1].dead)) {
          live.push(line.slice(6));
        }
      }
      const seen = new Set(), out = [];
      for (let i = live.length - 1; i >= 0 && out.length < max; i--) {
        // shortening is cosmetic — never let it cost us the task itself
        let h;
        try { h = stepHeadline(live[i]); } catch (e) { h = live[i]; }
        const key = h.toLowerCase();
        if (seen.has(key)) continue; // the same task often recurs across work packages
        seen.add(key);
        out.push(h);
      }
      return out.reverse().map(h => highlightOwners(escapeHtml(h)));
    }

    function parseProgress(text) {
      const total = (text.match(/^- \[[ xX]\]/gm) || []).length;
      const done  = (text.match(/^- \[[xX]\]/gm) || []).length;
      return total === 0 ? null : { done, total, pct: Math.round((done / total) * 100) };
    }

    function statusSlug(s) {
      if (!s) return 'unknown';
      if (s === 'Complete') return 'complete';
      if (s === 'In Progress') return 'in-progress';
      if (s === 'Planning') return 'planning';
      return 'unknown';
    }

    function formatUpdated(ms) {
      if (!ms) return '';
      const days = Math.floor((Date.now() - ms) / 86400000);
      if (days <= 0) return 'Updated today';
      if (days === 1) return 'Updated yesterday';
      if (days < 30) return `Updated ${days}d ago`;
      const months = Math.floor(days / 30);
      if (months < 12) return `Updated ${months}mo ago`;
      return `Updated ${Math.floor(months / 12)}y ago`;
    }

    function renderSteps(steps, allDone) {
      if (allDone) return `<p class="all-done">All tasks complete</p>`;
      if (!steps.length) return `<p class="no-tasks">—</p>`;
      return steps.map((s, i) => `<p class="step${i >= 2 ? ' extra' : ''}">${s}</p>`).join('');
    }

    function renderCard({ repo, overview, wp, pushedAt }) {
      const status   = parseStatus(overview);
      const summary  = parseSummary(overview);
      const progress = parseProgress(wp);
      const slug     = statusSlug(status);
      const pct      = progress ? progress.pct : 0;
      const allDone  = progress ? progress.done === progress.total && progress.total > 0 : false;
      const steps    = allDone ? [] : parseNextSteps(wp);
      const label    = progress ? `${progress.done} / ${progress.total}` : '—';

      return `
        <article class="card" data-expandable role="button" tabindex="0" aria-expanded="false">
          <div class="card-head">
            <h2>${formatName(repo)}</h2>
            <div class="head-right">
              <span class="status-badge"><span class="status-dot ${slug}"></span>${status || 'Unknown'}</span>
              <span class="chevron" aria-hidden="true">⌄</span>
            </div>
          </div>
          ${summary ? `<p class="summary">${summary}</p>` : ''}
          <div class="divider"></div>
          <div class="next-steps">${renderSteps(steps, allDone)}</div>
          <div class="divider"></div>
          <div class="progress-row">
            <div class="progress-bar">
              <div class="progress-fill ${slug}" style="width:${pct}%"></div>
            </div>
            <span class="progress-label">${label}</span>
          </div>
          <div class="card-foot">
            <a class="repo-link" href="https://github.com/${GITHUB_USER}/${repo}" target="_blank" rel="noopener">${repo}</a>
            <span class="updated">${formatUpdated(pushedAt)}</span>
          </div>
        </article>`;
    }

    function renderError(repo) {
      return `
        <article class="card">
          <h2>${formatName(repo)}</h2>
          <div class="divider"></div>
          <p class="no-tasks">Could not load</p>
          <a class="repo-link" href="https://github.com/${GITHUB_USER}/${repo}" target="_blank" rel="noopener">${repo}</a>
        </article>`;
    }

    async function init() {
      const container   = document.getElementById('projects');
      const metaText    = document.getElementById('metaText');
      const refreshBtn  = document.getElementById('refreshBtn');

      refreshBtn.disabled = true;
      metaText.textContent = 'zowen22 · loading…';

      const results = await Promise.allSettled(PROJECTS.map(fetchProject));

      const order = PROJECTS
        .map((_, i) => ({ i, t: results[i].status === 'fulfilled' ? results[i].value.pushedAt : 0 }))
        .sort((a, b) => b.t - a.t)
        .map(x => x.i);

      container.innerHTML = order.map(i => {
        const r = results[i];
        return r.status === 'fulfilled' ? renderCard(r.value) : renderError(PROJECTS[i]);
      }).join('') || '<p class="empty">No projects registered.</p>';

      const loaded = results.filter(r => r.status === 'fulfilled').length;
      const d = new Date();
      metaText.textContent = `zowen22 · ${loaded}/${PROJECTS.length} · ${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
      refreshBtn.disabled = false;
    }

    function toggleCard(card) {
      const expanded = card.classList.toggle('expanded');
      card.setAttribute('aria-expanded', String(expanded));
    }

    const projectsEl = document.getElementById('projects');

    projectsEl.addEventListener('click', (e) => {
      if (e.target.closest('a')) return; // let the repo link work normally
      const card = e.target.closest('.card[data-expandable]');
      if (card) toggleCard(card);
    });

    projectsEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('.card[data-expandable]');
      if (!card) return;
      e.preventDefault();
      toggleCard(card);
    });

    document.getElementById('refreshBtn').addEventListener('click', init);

    // Manage Projects — lets the user pick which of their GitHub repos show as cards,
    // independent of DEFAULT_PROJECTS. Selection is per-browser (localStorage), not synced.
    const manageBtn     = document.getElementById('manageBtn');
    const manageOverlay = document.getElementById('manageOverlay');
    const manageStatus  = document.getElementById('manageStatus');
    const manageList    = document.getElementById('manageList');

    let allRepoNamesCache = null;

    async function fetchAllRepoNames() {
      const res = await fetch(
        `https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=full_name`,
        { cache: 'no-store' }
      );
      if (!res.ok) throw new Error(res.status);
      const repos = await res.json();
      return repos.map(r => r.name).sort((a, b) => a.localeCompare(b));
    }

    function renderManageList(allRepos, selected) {
      const isSelected = new Set(selected);
      manageList.innerHTML = allRepos.map(repo => `
        <label class="manage-item">
          <input type="checkbox" value="${escapeHtml(repo)}" ${isSelected.has(repo) ? 'checked' : ''}>
          <span>${escapeHtml(formatName(repo))}</span>
        </label>`).join('');
    }

    async function openManage() {
      manageOverlay.hidden = false;
      manageStatus.textContent = 'Loading repos…';
      manageList.innerHTML = '';
      try {
        if (!allRepoNamesCache) allRepoNamesCache = await fetchAllRepoNames();
        manageStatus.textContent =
          `${allRepoNamesCache.length} public repos — private repos can't load here (no auth token)`;
        renderManageList(allRepoNamesCache, PROJECTS);
      } catch (e) {
        manageStatus.textContent = 'Could not load repo list — check connection and try again.';
      }
    }

    function closeManage() { manageOverlay.hidden = true; }

    manageBtn.addEventListener('click', openManage);
    document.getElementById('manageClose').addEventListener('click', closeManage);
    document.getElementById('manageCancel').addEventListener('click', closeManage);
    manageOverlay.addEventListener('click', (e) => { if (e.target === manageOverlay) closeManage(); });

    document.getElementById('manageSave').addEventListener('click', () => {
      PROJECTS = Array.from(manageList.querySelectorAll('input:checked')).map(cb => cb.value);
      saveSelectedProjects(PROJECTS);
      closeManage();
      init();
    });

    init();
  </script>
</body>
</html>
